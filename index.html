<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player - Lost Feelings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

  <!-- Album Cover -->
  <div class="cover"></div>

  <!-- Song Details -->
  <div class="details">
    <h2>Lost Feelings</h2>
    <p>Arjun V</p>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn">⏮</button>

    <input type="checkbox" id="play-toggle">
    <label for="play-toggle" class="play-btn"></label>

    <button class="btn">⏭</button>
  </div>

  <!-- Volume -->
  <div class="volume">
    <span>🔊</span>
    <input type="range">
  </div>

</div>
<P>2026</P>
</body>
</html>
